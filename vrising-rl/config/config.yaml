# ============================================================================
# V Rising RL — configuration centrale
# ============================================================================

# --- Connexion au mod (bridge TCP) ------------------------------------------
bridge:
  host: "127.0.0.1"
  port: 9000
  timeout_s: 10.0          # délai max d'attente d'une réponse du mod
  connect_retries: 5

# --- Définition de l'environnement ------------------------------------------
env:
  # Nombre de features dans le vecteur d'observation renvoyé par le mod.
  # Doit correspondre EXACTEMENT à ce que le mod envoie (voir Plugin.cs).
  observation_size: 16

  # Actions discrètes que l'agent peut choisir. L'ordre EST l'index envoyé au mod.
  actions:
    - "idle"
    - "move_up"
    - "move_down"
    - "move_left"
    - "move_right"
    - "primary_attack"     # clic gauche
    - "weapon_skill_1"     # clic droit
    - "ability_q"
    - "ability_e"
    - "ability_r"
    - "dodge"              # espace / travel
    - "interact"           # F

  max_episode_steps: 2000
  step_interval_s: 0.1     # cadence d'envoi des actions (10 Hz)

  # --- Récompense (à ajuster selon l'objectif) ------------------------------
  reward:
    damage_dealt: 1.0          # dégâts infligés
    damage_taken: -1.5         # dégâts subis
    enemy_killed: 50.0
    player_died: -200.0
    gear_level_gain: 100.0     # par niveau d'équipement gagné
    boss_killed: 500.0
    time_penalty: -0.01        # petite pénalité par pas (encourage l'efficacité)

# --- Hyperparamètres PPO (Stable-Baselines3) --------------------------------
ppo:
  policy: "MlpPolicy"
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  device: "auto"

# --- Entraînement -----------------------------------------------------------
train:
  total_timesteps: 1000000
  save_freq: 50000
  models_dir: "models"
  log_dir: "logs"
  run_name: "ppo_vrising"
